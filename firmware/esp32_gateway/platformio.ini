[platformio]
default_envs = cores3

[env:cores3]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=0
    -DGATEWAY_NETWORK_WIFI=1
lib_deps =
    https://github.com/m5stack/M5GFX.git#cc613d65f13a3a80021ef264a654e9e6a2419d8a
    m5stack/M5Unified@0.2.7
    arduino-libraries/Ethernet@2.0.2
    bblanchon/ArduinoJson@7.4.2
board_build.partitions = partitions.csv
extra_scripts = post:tools/merge_firmware.py

[env:cores3_ethernet]
extends = env:cores3
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=0
    -DGATEWAY_NETWORK_WIFI=0

[env:cores3_wokwi]
extends = env:cores3
build_flags =
    ${env:cores3.build_flags}
    -DGATEWAY_CONFIG_HEADER=\"gateway_wokwi_config.h\"

[env:cores3_emulator]
extends = env:cores3
build_flags =
    ${env:cores3.build_flags}
    -DGATEWAY_CONFIG_HEADER=\"gateway_emulator_config.h\"
