<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'">
<title>Platinum gateway</title>
<style>
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#203142;background:#f2f5f7;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button,.button{appearance:none;border:1px solid #d2dce4;border-radius:9px;background:#fff;color:#30465b;min-height:39px;padding:9px 13px;font-size:13px;font-weight:550;cursor:pointer;text-decoration:none;white-space:nowrap}button:hover,.button:hover{background:#eaf1f7}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,summary:focus-visible,.screen:focus-visible{outline:3px solid #70a7ce;outline-offset:4px}.wrap{max-width:1120px;margin:auto;padding:42px 28px 30px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}h1{margin:0;font-size:27px;font-weight:650;letter-spacing:-.035em}.actions{display:flex;gap:8px;align-items:center}.workspace{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,1fr);gap:30px;align-items:start}.device{background:linear-gradient(145deg,#2c3947,#131d29);padding:18px;border-radius:28px;box-shadow:0 15px 35px #172c4021,0 2px 4px #13253630;position:relative}.device:after{content:"";display:block;width:34px;height:4px;border-radius:4px;background:#111c28;margin:11px auto -4px}.screen{aspect-ratio:4/3;width:100%;overflow:hidden;border-radius:5px;background:#e8eef3;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;outline:none}.screen img{display:block;width:100%;height:100%;pointer-events:none;user-select:none;-webkit-user-drag:none}.shades{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.shade{min-width:0;background:#fff;border:1px solid #dfe6ec;border-radius:14px;padding:14px}.shade-name{font-size:13px;font-weight:650;overflow-wrap:anywhere;margin:0 0 13px;line-height:1.35}.window{position:relative;height:128px;border:5px solid #d5dfe6;border-bottom-width:7px;border-radius:3px;overflow:hidden;background:linear-gradient(#d9eaf4,#f5f9fc);box-shadow:inset 0 0 0 1px #fff8}.window:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:3px;background:#d5dfe6;transform:translateX(-50%)}.window:after{content:"";position:absolute;left:0;right:0;top:52%;height:3px;background:#d5dfe6}.blind{position:absolute;z-index:1;top:0;left:0;right:0;height:100%;background:repeating-linear-gradient(to bottom,#8c9ca9 0px,#9faeba 2px,#aab7c1 8px,#8d9eab 9px);border-bottom:4px solid #6c8191;box-shadow:0 5px 7px #40536730;transition:height .75s cubic-bezier(.22,.61,.36,1);will-change:height}.shade-value{display:block;text-align:right;margin-top:10px;font-size:12px;font-variant-numeric:tabular-nums;font-weight:600;color:#516b80}.shade.unknown .blind{opacity:.2}.empty{grid-column:1/-1;margin:0;padding:28px 16px;color:#7b8a98;text-align:center;font-size:13px}.connection{padding:11px 14px;margin:0 0 20px;border:1px solid #e7c6bd;background:#fff3ef;color:#8f4531;border-radius:9px;font-size:13px}.connection[hidden]{display:none}.activity{margin-top:28px;border-top:1px solid #dce4ea;padding-top:16px;color:#6c7f8e;font-size:12px}.activity summary{cursor:pointer;width:fit-content;padding:5px 0}.activity ol{list-style:none;padding:4px 0 0;margin:0;max-height:170px;overflow:auto}.activity li{padding:6px 0;border-bottom:1px solid #e3e9ee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;line-height:1.5}
@media(max-width:850px){.workspace{grid-template-columns:minmax(0,1.55fr) minmax(220px,1fr);gap:20px}.wrap{padding:30px 20px}.shades{gap:9px}.shade{padding:11px}.window{height:104px}.device{padding:14px;border-radius:23px}}
@media(max-width:650px){.wrap{padding:25px 16px}header{align-items:flex-start;flex-direction:column;gap:17px;margin-bottom:23px}h1{font-size:25px}.workspace{grid-template-columns:1fr;gap:25px}.shades{grid-template-columns:repeat(3,minmax(0,1fr))}.window{height:105px}.shade-name{font-size:12px}.actions{width:100%;flex-wrap:wrap}.device{max-width:540px;width:100%;margin:auto}.shade-value{font-size:11px}}
@media(max-width:380px){.shades{grid-template-columns:repeat(2,minmax(0,1fr))}.actions{gap:6px}button,.button{padding:8px 10px}}
@media(prefers-reduced-motion:reduce){.blind{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Platinum gateway</h1><div class="actions"><button id="reset" type="button">Reset</button><a class="button" href="/web" target="_blank" rel="noopener">Web interface</a><button id="copy-token" type="button">Copy token</button></div></header>
<p class="connection" id="connection" role="status" aria-live="polite" hidden></p>
<main class="workspace">
  <div class="device"><div class="screen" id="screen" tabindex="0" role="application" aria-label="Gateway touchscreen"><img id="screen-image" alt="Gateway touchscreen" draggable="false"></div></div>
  <div class="shades" id="shades" aria-label="Shades"></div>
</main>
<details class="activity"><summary>Activity</summary><ol id="events"></ol></details>
</div>
<script>
(() => {
  'use strict';
  const screen = document.getElementById('screen');
  const image = document.getElementById('screen-image');
  const shades = document.getElementById('shades');
  const events = document.getElementById('events');
  const connection = document.getElementById('connection');
  const reset = document.getElementById('reset');
  const copy = document.getElementById('copy-token');
  const cards = new Map();
  const pointers = new Set();
  let chain = Promise.resolve(), pending = 0, previousSvg = '', previousEvents = '';
  let activePointer = null, blocked = false, origin = null, lastMove = 0;
  let releasePending = false;

  function message(text) {
    connection.textContent = text;
    connection.hidden = !text;
  }
  function element(tag, className, value = '') {
    const node = document.createElement(tag);
    node.className = className;
    node.textContent = value;
    return node;
  }
  function paint(state) {
    if (typeof state.svg === 'string' && state.svg !== previousSvg) {
      previousSvg = state.svg;
      image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(state.svg);
    }
    if (Array.isArray(state.shades)) {
      const present = new Set();
      for (const shade of state.shades) {
        present.add(shade.id);
        let card = cards.get(shade.id);
        if (!card) {
          const node = element('article', 'shade');
          const name = element('h2', 'shade-name');
          const window = element('div', 'window');
          const blind = element('div', 'blind');
          const value = element('span', 'shade-value');
          window.setAttribute('aria-hidden', 'true');
          window.append(blind); node.append(name, window, value);
          card = {node, name, blind, value}; cards.set(shade.id, card);
          shades.append(node);
        }
        card.name.textContent = String(shade.name ?? '');
        const known = Number.isInteger(shade.position) && shade.position >= 0 && shade.position <= 255;
        const percent = known ? Math.round(shade.position * 100 / 255) : null;
        card.value.textContent = known ? percent + '% open' : '—';
        card.node.classList.toggle('unknown', !known);
        card.blind.style.height = known ? (100 - shade.position * 100 / 255) + '%' : '100%';
        card.blind.style.borderBottomWidth = known && shade.position === 255 ? '0' : '4px';
      }
      for (const [id, card] of cards) if (!present.has(id)) {
        card.node.remove(); cards.delete(id);
      }
      const empty = shades.querySelector('.empty');
      if (cards.size && empty) empty.remove();
      else if (!cards.size && !empty) shades.append(element('p', 'empty', 'No shades'));
    }
    if (Array.isArray(state.events)) {
      const latest = state.events.slice(-12).map(String);
      const signature = JSON.stringify(latest);
      if (signature !== previousEvents) {
        previousEvents = signature;
        events.replaceChildren(...latest.reverse().map(line => element('li', '', line)));
      }
    }
  }
  // Every request shares one queue. Polling never overtakes a press, move,
  // release or reset, and a stale response cannot replace a newer touch state.
  function enqueue(path, body, render = true) {
    ++pending;
    const request = chain.then(async () => {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);
      try {
        const options = {signal: controller.signal, cache: 'no-store'};
        if (body !== undefined) Object.assign(options, {
          method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
        });
        const response = await fetch(path, options);
        if (!response.ok) throw new Error('Gateway unavailable (' + response.status + ').');
        const value = await response.json();
        message('');
        if (render) paint(value);
        return value;
      } finally { clearTimeout(timeout); }
    });
    chain = request.catch(error => {
      message(error.name === 'AbortError' ? 'Connection timed out. Retrying…' : error.message);
      return null;
    }).finally(() => { --pending; });
    return chain;
  }
  function point(event) {
    const rect = screen.getBoundingClientRect();
    return {x: Math.floor((event.clientX - rect.left) * 320 / rect.width),
            y: Math.floor((event.clientY - rect.top) * 240 / rect.height)};
  }
  function inside(p) { return p.x >= 0 && p.y >= 0 && p.x < 320 && p.y < 240; }
  function releaseCancelled() {
    if (!releasePending) return;
    releasePending = false;
    enqueue('/sim/touch', {down: false, x: 0, y: 0});
  }
  function cancel() {
    activePointer = null; origin = null; blocked = pointers.size > 0;
    releasePending = true;
    enqueue('/sim/cancel', {});
    // The native model keeps a release barrier after cancellation. Never send
    // that release while another tracked finger is still touching the screen.
    if (!pointers.size) releaseCancelled();
    return chain;
  }
  screen.addEventListener('pointerdown', event => {
    if (reset.disabled) return;
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    event.preventDefault(); pointers.add(event.pointerId);
    try { screen.setPointerCapture(event.pointerId); } catch (_) {}
    if (pointers.size > 1) { cancel(); return; }
    if (blocked) return;
    const p = point(event);
    if (!inside(p)) { cancel(); return; }
    activePointer = event.pointerId; origin = p; lastMove = 0;
    enqueue('/sim/touch', {down: true, ...p});
  });
  screen.addEventListener('pointermove', event => {
    if (event.pointerId !== activePointer || blocked) return;
    event.preventDefault();
    const p = point(event);
    // Preserve an excursion even if move coalescing would otherwise hide it.
    if (!inside(p) || Math.abs(p.x - origin.x) > 15 || Math.abs(p.y - origin.y) > 15) {
      cancel(); return;
    }
    if (event.timeStamp - lastMove >= 40) {
      lastMove = event.timeStamp;
      enqueue('/sim/touch', {down: true, ...p});
    }
  });
  function finishPointer(event) {
    if (!pointers.has(event.pointerId)) return;
    event.preventDefault(); pointers.delete(event.pointerId);
    if (event.pointerId === activePointer && !blocked) {
      const p = point(event); activePointer = null; origin = null;
      if (inside(p)) enqueue('/sim/touch', {down: false, ...p});
      else cancel();
    }
    if (!pointers.size) { blocked = false; releaseCancelled(); }
    try { screen.releasePointerCapture(event.pointerId); } catch (_) {}
  }
  screen.addEventListener('pointerup', finishPointer);
  window.addEventListener('pointerup', finishPointer);
  screen.addEventListener('pointercancel', event => {
    pointers.delete(event.pointerId); cancel();
  });
  screen.addEventListener('lostpointercapture', event => {
    if (event.pointerId === activePointer) { pointers.delete(event.pointerId); cancel(); }
  });
  screen.addEventListener('contextmenu', event => event.preventDefault());
  screen.addEventListener('keydown', event => { if (event.key === 'Escape') cancel(); });
  window.addEventListener('blur', () => {
    if (activePointer !== null || pointers.size) { pointers.clear(); cancel(); }
  });
  reset.addEventListener('click', async () => {
    reset.disabled = true; pointers.clear();
    await cancel(); await enqueue('/sim/reset', {});
    reset.disabled = false;
  });
  copy.addEventListener('click', async () => {
    copy.disabled = true;
    const info = await enqueue('/sim/info', undefined, false);
    if (info && typeof info.token === 'string') {
      try {
        await navigator.clipboard.writeText(info.token); copy.textContent = 'Copied';
        setTimeout(() => { copy.textContent = 'Copy token'; }, 1800);
      } catch (_) { message('Could not copy the token.'); }
    }
    copy.disabled = false;
  });
  enqueue('/sim/state');
  setInterval(() => { if (!pending && !document.hidden) enqueue('/sim/state'); }, 250);
})();
</script>
</body>
</html>
